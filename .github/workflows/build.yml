name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/savant-homekit-bridge" >> "$GITHUB_OUTPUT"
          v=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' bridge/__init__.py | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q bridge tools
          python -c "import xml.etree.ElementTree as E,glob;[E.parse(f) for f in glob.glob('savant-profiles/*.xml')]"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
